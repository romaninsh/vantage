<!doctype html>
<!-- The book moved to https://vantage-ui.com/book/. This page is published to
     romaninsh.github.io/vantage as both index.html and 404.html, so every old
     URL lands here and is sent to the same page at the new address. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Vantage Framework book has moved</title>
    <link rel="canonical" href="https://vantage-ui.com/book/">
    <meta name="robots" content="noindex">
    <noscript><meta http-equiv="refresh" content="0; url=https://vantage-ui.com/book/"></noscript>
    <script>
        var rest = location.pathname.replace(/^\/vantage\/?/, "");
        location.replace("https://vantage-ui.com/book/" + rest + location.search + location.hash);
    </script>
</head>
<body>
    <p>The Vantage Framework book has moved to <a href="https://vantage-ui.com/book/">vantage-ui.com/book</a>.</p>
</body>
</html>
