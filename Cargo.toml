[workspace]
members = [
    "vantage-core",
    "vantage-expressions",
    "vantage-redb",
    "vantage-memory",
    "surreal-client",
    "vantage-dataset",
    "vantage-table",
    "vantage-csv",
    "vantage-types", "learn-1", "learn-2", "learn-3", "learn-4", "learn-5", "learn-6", "learn-7",
    "learn-8",
    "learn-9",
    "learn-10",
    "learn-11",
    "vantage-vista",
    "vantage-rhai",
    "vantage-diorama",
    "vantage-action",
    "vantage-bundle",
    "vantage-api-adapters",
    "vantage-log-writer",
    "vantage-sql",
    "vantage-surrealdb",
    "vantage-mongodb",
    "vantage-api-client",
    "vantage-api-pool",
    "vantage-cli-util",
    "vantage-inventory",
    "bakery_model3",
    "bakery_model4",
    "docs4",
]
exclude = [
    "learn-ds",
    "learn-qw",
    "learn-qw7",
    "vantage-aws",
    "vantage-kubernetes",
    "example_*",
    "vantage-ui-adapters",
    "test-api-server",
    "vantage-cmd",
    "vantage-faker",
    "vantage-faker-stress",
    "vantage-spacetimedb",
]
resolver = "3"

# Dev builds are for compiling fast, not for debuggers: no debuginfo means
# no per-relink object files left in target/debug/deps, and about half the
# cold-build time. Set CARGO_PROFILE_DEV_DEBUG=true for a session that
# needs a debugger.
[profile.dev]
debug = false
