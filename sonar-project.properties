sonar.projectKey=romaninsh_vantage
sonar.organization=romaninsh


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=vantage
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# The tutorials repeat their setup on purpose, so they don't count as duplication.
sonar.cpd.exclusions=learn-*/**

# coverage/ is dev tooling run by hand: its paths come from the operator's own
# command line, and the exception tokens are signatures, not secrets.
sonar.coverage.exclusions=coverage/**
sonar.issue.ignore.multicriteria=tokens,paths,dbsecrets,dbpasswords,unlocked
sonar.issue.ignore.multicriteria.tokens.ruleKey=yaml:S6418
sonar.issue.ignore.multicriteria.tokens.resourceKey=coverage/exceptions/*.yaml
sonar.issue.ignore.multicriteria.paths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.paths.resourceKey=coverage/**

# start-services starts throwaway database containers on a CI runner. Their
# vantage/vantage and root/root logins are the ones the tests' own connection
# URLs use (e.g. postgres://vantage:vantage@localhost:5433), not secrets.
sonar.issue.ignore.multicriteria.dbsecrets.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.dbsecrets.resourceKey=.github/actions/start-services/action.yml
sonar.issue.ignore.multicriteria.dbpasswords.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.dbpasswords.resourceKey=.github/actions/start-services/action.yml

# The crates outside the workspace commit lockfiles that lag their path
# dependencies' versions, so their suite builds without --locked, as the
# per-crate workflows before it did.
sonar.issue.ignore.multicriteria.unlocked.ruleKey=githubactions:S8549
sonar.issue.ignore.multicriteria.unlocked.resourceKey=.github/workflows/suite-excluded.yaml
