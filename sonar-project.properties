sonar.projectKey=romaninsh_vantage
sonar.organization=romaninsh


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=vantage
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# The tutorials repeat their setup on purpose, so they don't count as duplication.
sonar.cpd.exclusions=learn-*/**

# coverage/ is dev tooling run by hand: its paths come from the operator's own
# command line, and the exception tokens are signatures, not secrets.
sonar.coverage.exclusions=coverage/**
sonar.issue.ignore.multicriteria=tokens,paths
sonar.issue.ignore.multicriteria.tokens.ruleKey=yaml:S6418
sonar.issue.ignore.multicriteria.tokens.resourceKey=coverage/exceptions/*.yaml
sonar.issue.ignore.multicriteria.paths.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.paths.resourceKey=coverage/**
