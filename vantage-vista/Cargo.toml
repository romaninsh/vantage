[package]
name = "vantage-vista"
version = "2.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Universal, schema-bearing data handle for the Vantage data framework"
repository = "https://github.com/romaninsh/vantage"

[lib]
doctest = false

[dependencies]
vantage-core = { version = "1.1.0", path = "../vantage-core" }
vantage-types = { version = "1.0.0", path = "../vantage-types" }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset" }
ciborium = { version = "0.2", features = ["std"] }
indexmap = { version = "2.14", features = ["serde"] }
async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2.0"
vantage-rhai = { version = "1.1.0", path = "../vantage-rhai", optional = true }
# The agent-tool runners (`run_script`, `preview_script`) answer in JSON.
serde_json = { version = "1", optional = true }
# `sync` for the semaphore that gates a mock's `get`. The `rhai` feature adds
# `rt`/`rt-multi-thread` for the spawn_blocking + Handle::block_on bridge that
# drives the async Vista fetches from the synchronous Rhai engine.
tokio = { version = "1.52", features = ["sync"], optional = true }
# Scripts hand `dynamic_to_cbor` chrono instants (a host's `now()`).
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
# `IdGenerator`: UUIDv7/v4 ids, and short ids drawn from the OS random source.
uuid = { version = "1", features = ["v4", "v7"] }
getrandom = "0.4"

[features]
# Rhai scripting over the type-erased `Vista`: `DataVocab`, the table handle
# (`table`/`where`/`sort`/`search`/`limit`/`ref`) with read and write terminals,
# the script-slot evaluators and the `run_script` runner. Backends layer their
# vendor expression vocabulary on top via `TableShell::register_rhai_extensions`.
rhai = [
    "dep:vantage-rhai",
    "dep:serde_json",
    "dep:tokio",
    "tokio/rt",
    "tokio/rt-multi-thread",
    "dep:chrono",
    "vantage-types/serde",
]
# Driver-facing checks (`vantage_vista::contract`) that every backend's test
# suite runs against its own fixture. Enable from `[dev-dependencies]` only.
contract = []
# `vantage_vista::mocks`: an in-memory `TableShell` for tests and examples.
# Enable from `[dev-dependencies]` only.
mocks = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset", features = ["contract"] }
serde_json = "1"
# Memory-backed Vistas for the script vocabulary tests. Integration tests only:
# vantage-memory depends on this crate, so unit tests would see two copies.
vantage-memory = { path = "../vantage-memory" }

[[test]]
name = "contract"
required-features = ["contract", "mocks"]

[[test]]
name = "contained"
required-features = ["mocks"]

[[test]]
name = "rhai_vocab"
required-features = ["rhai", "mocks"]

[[test]]
name = "rhai_guide"
required-features = ["rhai"]

[[test]]
name = "rhai_rule"
required-features = ["rhai"]
