[package]
name = "vantage-tester"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "What-if scenario tests: parses scenario YAML, plans the what-if tree and walks it through a host"
repository = "https://github.com/romaninsh/vantage"
readme = "README.md"
keywords = ["testing", "scenarios", "yaml", "vantage"]

[dependencies]
vantage-core = { version = "1.3.0", path = "../vantage-core" }
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
