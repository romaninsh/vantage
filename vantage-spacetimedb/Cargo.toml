[package]
name = "vantage-spacetimedb"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Romans Malinovskis <me@nearly.guru>"]
description = "SpacetimeDB persistence backend for Vantage framework — incubating"
documentation = "https://docs.rs/vantage-spacetimedb"
homepage = "https://romaninsh.github.io/vantage"
repository = "https://github.com/romaninsh/vantage"
readme = "README.md"

[dependencies]
vantage-core = { version = "0.6" }
vantage-types = { version = "0.6", features = ["serde"] }
vantage-vista = { version = "0.6" }

# Official SpacetimeDB crates, used for the *wire format only* — we own the
# connection. The typed `spacetimedb-sdk` is deliberately not a dependency: it
# requires per-module bindings generated by the CLI, and a Vantage datasource is
# named in YAML at runtime, so there is no build step at which the schema is
# known. See the crate docs for the full argument.
#
# `serde` feature on sats is load-bearing: the module-definition types derive
# SpacetimeType (SATS), not serde, so JSON decoding goes through the
# `spacetimedb_sats::serde::SerdeWrapper` bridge.
spacetimedb-lib = "2.7"
spacetimedb-sats = { version = "2.7", features = ["serde"] }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
# `raw_value` lets a row be kept as un-decoded JSON text and handed to the
# schema-seeded deserializer, which is the only way to read a positional row
# correctly (see `value.rs`).
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
indexmap = { version = "2", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"

# Vista speaks CBOR at its value boundary.
ciborium = "0.2"

[dev-dependencies]
# The value-set traits (`list_values`, `get_value`) live here; the Vista
# facade implements them.
vantage-dataset = "0.6"
pretty_assertions = "1"
tokio = { version = "1", features = ["full"] }
