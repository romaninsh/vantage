[package]
edition = "2024"
name = "vantage-api-pool"
version = "1.1.0"
license = "MIT OR Apache-2.0"
description = "Resilient async HTTP client for Vantage: bounded parallelism, retry, circuit breaker, rate limit and auth refresh"

[dependencies]
anyhow = "1.0"
reqwest = "0.12"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
