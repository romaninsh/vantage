# octocov reads the LCOV report the coverage workflow writes, comments on the
# PR, adds a job summary, and keeps each push's report as an artifact so a
# PR's coverage is shown against its base.
coverage:
  paths:
    - lcov.info
codeToTestRatio:
  code:
    - "**/src/**/*.rs"
  test:
    - "**/tests/**/*.rs"
testExecutionTime:
  if: true
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  hideFooterLink: true
summary:
  if: true
report:
  if: github.event_name == 'push'
  datastores:
    - artifact://${GITHUB_REPOSITORY}
