[package]
name = "vantage-faker"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Romans Malinovskis <me@nearly.guru>"]
description = "Synthetic data for Vantage: column generators seeding vantage-memory tables, and Rhai sims that mutate them live"
documentation = "https://docs.rs/vantage-faker"
homepage = "https://romaninsh.github.io/vantage"
repository = "https://github.com/romaninsh/vantage"
readme = "README.md"

# Standalone crate: excluded from the parent vantage workspace, so an empty
# workspace table detaches it (mirrors vantage-cmd / vantage-aws).
[workspace]

[dependencies]
vantage-core = { version = "0.6", path = "../vantage-core" }
vantage-types = { version = "0.6", path = "../vantage-types", features = ["serde"] }
vantage-vista = { version = "0.6.25", path = "../vantage-vista" }
vantage-memory = { version = "0.6.1", path = "../vantage-memory" }
# `TableShell::preview_query` answers with a driver-shaped JSON value.
serde_json = "1"
# `ColumnGen` deserializes from table config.
serde = { version = "1", features = ["derive"] }

# Universal value carrier across the type-erased Vista boundary.
ciborium = "0.2"
indexmap = { version = "2", features = ["serde"] }
async-trait = "0.1"

# `ShapedShell` sleeps out its configured latency and reads the clock for
# offline schedules and cursor-token ages.
tokio = { version = "1", features = ["time"] }

# Third-party realistic value generation (names, emails, addresses, …).
fake = "5"

# The `sim` engine's scripted mutation loops. Same rhai as vantage-vista's
# scripting feature, kept optional so the default build stays light.
vantage-rhai = { version = "0.6.2", path = "../vantage-rhai", optional = true }

tracing = "0.1"

[features]
sim = ["dep:vantage-rhai"]
serde = []

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
vantage-core = { version = "0.6", path = "../vantage-core" }
# `list_values` in tests reads back through the Vista's dataset traits.
vantage-dataset = { version = "0.6", path = "../vantage-dataset" }
# `StreamExt::next` polls a `watch()` stream in tests.
futures-util = "0.3"
# `test-util` for the paused-clock latency/offline/cursor-expiry tests.
tokio = { version = "1", features = ["full", "test-util"] }
# `ColumnGen`'s YAML shape, as vantage-ui table configs write it.
serde_yaml_ng = "0.10"
