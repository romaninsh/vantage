[package]
name = "vantage-faker"
version = "4.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Romans Malinovskis <me@nearly.guru>"]
description = "Synthetic data for Vantage: column generators seeding vantage-memory tables, and Rhai sims that mutate them live"
documentation = "https://docs.rs/vantage-faker"
homepage = "https://romaninsh.github.io/vantage"
repository = "https://github.com/romaninsh/vantage"
readme = "README.md"

# Standalone crate: excluded from the parent vantage workspace, so an empty
# workspace table detaches it (mirrors vantage-cmd / vantage-aws).
[workspace]

[dependencies]
vantage-core = { version = "1.4.0", path = "../vantage-core" }
vantage-types = { version = "1.0.0", path = "../vantage-types", features = ["serde"] }
vantage-vista = { version = "3.0.0", path = "../vantage-vista" }
vantage-memory = { version = "5.0.0", path = "../vantage-memory" }
# `Inserted`, the shell insert's outcome.
vantage-dataset = { version = "2.0.0", path = "../vantage-dataset" }
# A sim's spawn `args` are a JSON object.
serde_json = "1"
# `ColumnGen` deserializes from table config.
serde = { version = "1", features = ["derive"] }

# Universal value carrier across the type-erased Vista boundary.
ciborium = "0.2"
indexmap = { version = "2", features = ["serde"] }
async-trait = "0.1"

# `ShapedShell` sleeps out its configured latency, reads the clock for
# offline schedules and cursor-token ages, and spawns queued inserts.
tokio = { version = "1", features = ["rt", "time"] }

# Third-party realistic value generation (names, emails, addresses, …).
fake = "5"

# The `sim` engine's scripted mutation loops. Same rhai as vantage-vista's
# scripting feature, kept optional so the default build stays light.
vantage-rhai = { version = "1.1.0", path = "../vantage-rhai", optional = true }

tracing = "0.1"

[features]
sim = ["dep:vantage-rhai", "vantage-vista/rhai"]
# No-op: `config` and the serde derives are always built. Kept so existing
# `features = ["serde"]` requirements still resolve.
serde = []

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
vantage-core = { version = "1.4.0", path = "../vantage-core" }
# `vantage_vista::contract` over shaped and counted shells.
vantage-vista = { version = "3.0.0", path = "../vantage-vista", features = ["contract"] }
# `StreamExt::next` polls a `watch()` stream in tests.
futures-util = "0.3"
# `test-util` for the paused-clock latency/offline/cursor-expiry tests.
tokio = { version = "1", features = ["full", "test-util"] }
# `ColumnGen`'s YAML shape, as vantage-ui table configs write it.
serde_yaml_ng = "0.10"
# Parses a sim-inserted id to check it is a UUIDv7.
uuid = { version = "1", features = ["v7"] }
