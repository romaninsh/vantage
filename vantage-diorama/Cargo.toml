[package]
name = "vantage-diorama"
version = "0.12.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Cached, composable, reactive surface for Vantage Vistas"
repository = "https://github.com/romaninsh/vantage"

[lib]
doctest = false

[dependencies]
vantage-core = { version = "0.6", path = "../vantage-core" }
vantage-types = { version = "0.6", path = "../vantage-types" }
vantage-vista = { version = "0.6.22", path = "../vantage-vista" }
vantage-vista-factory = { version = "0.6", path = "../vantage-vista-factory" }
vantage-table = { version = "0.6", path = "../vantage-table" }
vantage-dataset = { version = "0.6", path = "../vantage-dataset" }
# `TableShell::preview_query` answers with a driver-shaped JSON value.
serde_json = "1"

async-trait = "0.1"
ciborium = { version = "0.2", features = ["std"] }
rhai = { version = "1.25", optional = true }
futures = "0.3"
indexmap = "2"
redb = "2.6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[features]
# Servo as a first-class Rhai type — the same treatment vantage-vista's
# `rhai` feature gives queries. See `src/rhai.rs`.
rhai = ["dep:rhai"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Diagnostic output in loader tests (`with_test_writer` + env filter).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util", "sync", "time"] }
vantage-csv = { path = "../vantage-csv", features = ["vista"] }
vantage-sql = { path = "../vantage-sql", features = ["sqlite", "vista"] }
vantage-cmd = { path = "../vantage-cmd" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
cucumber = { version = "0.21", default-features = false, features = ["macros"] }
insta = { version = "1.41", features = ["yaml", "filters"] }
rstest = "0.23"
futures = "0.3"

[[test]]
name = "bdd"
harness = false

[[test]]
name = "rhai_servo"
required-features = ["rhai"]
