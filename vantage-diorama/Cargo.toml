[package]
name = "vantage-diorama"
version = "1.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Cached, composable, reactive surface for Vantage Vistas"
repository = "https://github.com/romaninsh/vantage"

[lib]
doctest = false

[dependencies]
vantage-core = { version = "1.1.0", path = "../vantage-core" }
vantage-types = { version = "1.0.0", path = "../vantage-types" }
vantage-vista = { version = "2.0.0", path = "../vantage-vista" }
vantage-table = { version = "3.0.0", path = "../vantage-table" }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset" }

async-trait = "0.1"
ciborium = { version = "0.2", features = ["std"] }
vantage-rhai = { version = "1.1.0", path = "../vantage-rhai", optional = true }
futures = "0.3"
indexmap = "2"
redb = "2.6"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[features]
# Servo as a first-class Rhai type — the same treatment vantage-vista's
# `rhai` feature gives queries. See `src/rhai.rs`. Pulls vista's `rhai`
# for the shared CBOR ⇄ Dynamic converters, so a value round-trips the same
# way in a servo script as in a vista script.
rhai = ["dep:vantage-rhai", "vantage-vista/rhai"]
# The debug tap, its formatters, process stats and Dio diagnostics.
diagnostics = []
# Hooks for test harnesses that observe a Dio's internals.
test-util = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
# Diagnostic output in loader tests (`with_test_writer` + env filter).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util", "sync", "time"] }
vantage-csv = { path = "../vantage-csv", features = ["vista"] }
vantage-sql = { path = "../vantage-sql", features = ["sqlite", "vista"] }
vantage-cmd = { path = "../vantage-cmd" }
vantage-vista = { version = "2.0.0", path = "../vantage-vista", features = ["contract", "mocks"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
cucumber = { version = "0.21", default-features = false, features = ["macros"] }
insta = { version = "1.41", features = ["yaml", "filters"] }
rstest = "0.23"
futures = "0.3"

[[test]]
name = "bdd"
harness = false
required-features = ["diagnostics", "test-util"]

[[test]]
name = "rhai_servo"
required-features = ["rhai"]

[[test]]
name = "debug_tap"
path = "tests/debug_tap/main.rs"
required-features = ["diagnostics"]

[[test]]
name = "aggregate_debug_tap"
required-features = ["diagnostics"]
