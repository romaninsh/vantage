[package]
edition = "2024"
name = "vantage-expressions"
version = "1.3.2"
license = "MIT OR Apache-2.0"
authors = ["Romans Malinovskis <me@nearly.guru>"]
description = "Database agnostic expressions"
homepage = "https://romaninsh.github.io/vantage"
repository = "https://github.com/romaninsh/vantage"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
vantage-core = { version = "1.0.0", path = "../vantage-core" }

[features]
# Enabled nothing since chrono support moved to vantage-types; kept so existing feature lists build.
chrono = []

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-test = "0.4"
