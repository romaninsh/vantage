[package]
name = "vantage-inventory"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "YAML project inventory: !include-aware load pipeline, kind registry, reloads and schema emission"
repository = "https://github.com/romaninsh/vantage"
readme = "README.md"
keywords = ["yaml", "inventory", "json-schema", "include", "vantage"]

[lib]
doctest = false

[features]
default = []
watch = ["dep:notify"]

[dependencies]
anyhow = "1.0.102"
jsonschema = { version = "0.18.3", default-features = false }
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
notify = { version = "6.1.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
