[package]
name = "vantage-docs"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
vantage-core = { path = "../vantage-core" }
vantage-dataset = { path = "../vantage-dataset" }
# `diagnostics` so the optimising chapters' links (stats::reset_fetch_stats, …) resolve.
vantage-diorama = { path = "../vantage-diorama", features = ["diagnostics"] }
vantage-expressions = { path = "../vantage-expressions" }
vantage-mongodb = { path = "../vantage-mongodb" }
vantage-sql = { path = "../vantage-sql", features = ["sqlite", "postgres"] }
vantage-table = { path = "../vantage-table" }
vantage-types = { path = "../vantage-types" }
# `rhai` so the Rhai chapters' links (Handle, run_script, …) resolve.
vantage-rhai = { path = "../vantage-rhai" }
vantage-vista = { path = "../vantage-vista", features = ["rhai", "mocks"] }
