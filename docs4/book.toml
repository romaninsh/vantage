[book]
authors = ["Romans Malinovskis"]
language = "en"
src = "src"
title = "Vantage Framework"

[preprocessor.toc]
max-level = 3

# rustdoc-links runs `cargo doc` over the linked crates (slow on a cold
# target dir); disabled locally, enabled in the CI workflow. 3.x documents
# only workspace packages by default, so the book's dependencies are listed.
# [preprocessor.rustdoc-links]
# manifest-dir = "."
# build.packages = [{ name = "vantage-docs", dependencies = true }]

[preprocessor.admonish]
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
command = "mdbook-admonish"

[preprocessor.mermaid]

[output.html]
additional-css = ["./mdbook-admonish.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
