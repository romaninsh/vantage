# @llm-protected: per-package coverage settings. Only the user changes this file.
#
# exclude:   globs relative to the crate. Regions under them count neither as covered nor as
#            lost, so no test is written or kept for them.
# tolerance: how many lost regions count as run-to-run noise. A run that loses no more than this
#            has nothing to restore.

vantage-action:
  tolerance: 10

vantage-api-adapters:
  tolerance: 10

vantage-api-pool:
  tolerance: 10

vantage-bundle:
  tolerance: 10

vantage-cli-util:
  tolerance: 10

vantage-core:
  tolerance: 10

vantage-dataset:
  tolerance: 10
  exclude:
    # Test fixture: exercised wherever it stands in for a backend.
    - src/mocks.rs
    - src/mocks/**

vantage-expressions:
  tolerance: 10
  exclude:
    # Test fixture: exercised wherever it stands in for a backend.
    - src/mocks.rs
    - src/mocks/**

vantage-inventory:
  tolerance: 10

vantage-log-writer:
  tolerance: 10

vantage-memory:
  tolerance: 10

vantage-types:
  tolerance: 10

vantage-vista:
  tolerance: 10
  exclude:
    # Test fixture: exercised wherever it stands in for a backend.
    - src/mocks.rs
    - src/mocks/**
