[package]
name = "matrix-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Per-test code regions for coverage/matrix.sh, read straight from LLVM profiles"

# Its own workspace: a tool for the repo, not part of the library.
[workspace]

[dependencies]
anyhow = "1"
llvm_profparser = "0.15"
rayon = "1"
serde_json = "1"

[profile.release]
debug = false
