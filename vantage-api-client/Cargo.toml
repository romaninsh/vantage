[package]
edition = "2024"
name = "vantage-api-client"
version = "2.3.0"
license = "MIT OR Apache-2.0"
authors = ["Romans Malinovskis <me@nearly.guru>"]
description = "Vantage extension for REST and GraphQL HTTP API backends"

[features]
# `lazy:` columns on REST tables, computed by the Vista from each returned
# record.
rhai = ["vantage-vista/rhai", "dep:rhai", "dep:vantage-rhai"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
indexmap = { version = "2", features = ["serde"] }
paste = "1"
reqwest = { version = "0.12", features = ["json"] }
rhai = { version = ">=1.25, <1.27", optional = true, default-features = false, features = ["std", "sync", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
tokio = { version = "1.52", features = ["time"] }
tracing = "0.1"
urlencoding = "2.1"
uuid = { version = "1", features = ["serde", "v7"] }
vantage-api-pool = { version = "1.2.0", path = "../vantage-api-pool" }
vantage-core = { version = "1.0.0", path = "../vantage-core" }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset" }
vantage-expressions = { version = "1.3.0", path = "../vantage-expressions" }
vantage-rhai = { version = "1.4.0", path = "../vantage-rhai", optional = true }
vantage-table = { version = "3.5.0", path = "../vantage-table" }
vantage-types = { version = "1.0.0", path = "../vantage-types", features = ["serde"] }
vantage-vista = { version = "2.6.0", path = "../vantage-vista" }

[dev-dependencies]
anyhow = "1.0"
tokio = { version = "1.52", features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
vantage-cli-util = { path = "../vantage-cli-util" }
vantage-vista = { version = "2.6.0", path = "../vantage-vista", features = ["contract"] }
wiremock = "0.6"
