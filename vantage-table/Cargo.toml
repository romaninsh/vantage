[package]
name = "vantage-table"
version = "3.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Table, Column, and operation traits for the Vantage data framework"
repository = "https://github.com/romaninsh/vantage"
autoexamples = false

[[example]]
name = "mockbuilder_demo"
path = "examples/mockbuilder_demo.rs"

[lib]
doctest = false


[dependencies]
vantage-core = { version = "1.1.0", path = "../vantage-core" }
vantage-types = { version = "1.0.0", path = "../vantage-types" }
vantage-expressions = { version = "1.2.0", path = "../vantage-expressions" }
vantage-vista = { version = "2.0.0", path = "../vantage-vista" }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset" }
async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = { version = "0.2", features = ["std"] }
indexmap = "2.14"
paste = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
rust_decimal = { version = "1.42.0", features = ["macros", "serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# `vantage_table::mocks`: in-memory `TableSource`, column, reference and type
# system for tests. Enable from `[dev-dependencies]` only.
mocks = []
# `vantage_table::rule`: `TableRuleTarget`, the table a rule script's
# `RuleHandle` (vantage-vista) narrows.
rhai = ["vantage-vista/rhai"]

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1.0"
vantage-expressions = { version = "1.2.0", path = "../vantage-expressions" }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset", features = ["contract"] }
vantage-vista = { version = "2.0.0", path = "../vantage-vista", features = ["mocks"] }
# vantage-surrealdb = { path = "../vantage-surrealdb" }
surreal-client = { version = "1.0.0", path = "../surreal-client" }
async-trait = "0.1"
ciborium = { version = "0.2", features = ["std"] }
url = { version = "2.5", features = ["serde"] }
vantage-rhai = { version = "1.1.0", path = "../vantage-rhai" }

# Disable tests during 0.3 migration
[[test]]
name = "expr"
path = "tests/expr.rs"
test = false
required-features = ["mocks"]

[[test]]
name = "table_like"
path = "tests/table_like.rs"

[[test]]
name = "generic1"
required-features = ["mocks"]

[[test]]
name = "mock_contract"
required-features = ["mocks"]

[[test]]
name = "record_methods"
required-features = ["mocks"]

[[test]]
name = "table_rule_target"
required-features = ["mocks", "rhai"]
