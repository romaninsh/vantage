[package]
name = "vantage-mongodb"
version = "3.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MongoDB persistence backend for Vantage framework"
repository = "https://github.com/romaninsh/vantage"

[features]
default = []
vista = ["dep:vantage-vista", "dep:async-stream"]
# `rhai` scripts only ever act on vistas (`modify:`, `rhai:` pipeline views,
# scripted references), so it pulls in the vista layer and its conventional
# engine. Keeping them coupled means `register_rhai_extensions` always has the
# `vantage-vista` rhai vocabulary to layer onto.
rhai = ["dep:vantage-rhai", "vista", "vantage-vista/rhai"]

[dependencies]
vantage-core = { version = "1.1.0", path = "../vantage-core" }
vantage-types = { version = "1.0.0", path = "../vantage-types", features = ["serde"] }
vantage-expressions = { version = "1.2.0", path = "../vantage-expressions" }
vantage-table = { version = "3.0.0", path = "../vantage-table" }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset" }
vantage-vista = { version = "2.1.0", path = "../vantage-vista", optional = true }
vantage-rhai = { version = "1.1.0", path = "../vantage-rhai", optional = true }

bson = "2"
ciborium = { version = "0.2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
paste = "1"
async-trait = "0.1"
mongodb = "3"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-stream = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
pretty_assertions = "1"
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset", features = ["contract"] }
serde_yaml_ng = "0.10"
vantage-vista = { version = "2.1.0", path = "../vantage-vista", features = ["contract"] }
vantage-table = { version = "3.0.0", path = "../vantage-table", features = ["rhai"] }
