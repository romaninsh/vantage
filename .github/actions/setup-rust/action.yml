name: Set up Rust
description: Toolchain, the job's Rust cache, and test tools.

# Caching is the setup the per-crate workflows used before this pipeline:
# rust-cache with a job's own key, workspace and all crates cached, saved on
# every branch with the action's defaults. A repo on WarpBuild runners uses
# WarpBuild's cache instead (backend: warpbuild): one key per profile, runner
# and ISO week, saved when that key is new. It holds cargo's registry and git
# checkouts, plus target/ when `target: true` — a job that sets it runs
# script/ci-prune-target last, so only third-party crates are saved:
# vantage-ui's whole target/ was 62 GB of linked test binaries, 5m45s to
# restore for 1m30s of compile.
inputs:
  profile:
    description: "normal | instrumented | nightly"
    default: normal
  toolchain:
    description: Toolchain for the nightly profile (stable otherwise)
    default: stable
  tools:
    description: Comma-separated tools for taiki-e/install-action
    default: ""
  workspaces:
    description: rust-cache workspaces (an excluded crate's dir)
    default: ". -> target"
  key:
    description: Extra cache key (for excluded crates)
    default: ""
  cache:
    description: Restore the Rust cache ("false" for jobs that only run archived binaries)
    default: "true"
  backend:
    description: "rust-cache | warpbuild"
    default: rust-cache
  lookup:
    description: Only check whether the cache key exists (warpbuild); sets the cache-hit output
    default: "false"
  target:
    description: Also cache target/ (warpbuild); the job prunes it with script/ci-prune-target before the save
    default: "false"
outputs:
  cache-hit:
    description: The exact key exists (lookup mode)
    value: ${{ steps.lookup.outputs.cache-hit }}
  target-key:
    description: With `target`, the key the job saves under (script/ci-prune-target, then WarpBuilds/cache/save)
    value: ${{ steps.restore.outputs.cache-primary-key }}
  target-hit:
    description: With `target`, the exact key was restored (nothing to save)
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Shared build flags
      if: inputs.lookup != 'true'
      shell: bash
      run: |
        # No debug info: the workspace's [profile.dev] already has `debug = false`,
        # coverage reads LLVM's own mapping, and it would only bloat the archive.
        {
          echo "CARGO_TERM_COLOR=always"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"

    - if: inputs.lookup != 'true'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.profile == 'instrumented' && 'llvm-tools-preview' || 'clippy, rustfmt' }}

    - if: inputs.cache == 'true' && inputs.backend == 'rust-cache' && inputs.lookup != 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.profile }}${{ inputs.key && format('-{0}', inputs.key) || '' }}
        workspaces: ${{ inputs.workspaces }}
        cache-on-failure: true
        cache-workspace-crates: true
        cache-all-crates: true

    # The week rotates the key: a restore-key hit saves restored plus new
    # downloads, so without it the cache only grows. `deps-` and `cargo-` keep
    # the two kinds apart: WarpBuild matched a key across path lists.
    - if: inputs.backend == 'warpbuild'
      id: week
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    # The keys hash the caller's lockfiles only: the shared checkout (.ci/)
    # brings vantage's own, and every pin bump would rotate the caller's key.
    - if: inputs.cache == 'true' && inputs.backend == 'warpbuild' && inputs.lookup != 'true' && inputs.target != 'true'
      uses: WarpBuilds/cache@40f3443ae7b70e568d6e2070ea897f3df94d7553 # v1
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ inputs.profile }}${{ inputs.key && format('-{0}', inputs.key) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ hashFiles('**/Cargo.lock', '!.ci/**') }}
        restore-keys: |
          cargo-${{ inputs.profile }}${{ inputs.key && format('-{0}', inputs.key) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-
    # With target/: restore only. The job saves it itself, last, after pruning,
    # whether it passed or not (the action's own save runs on success only, and
    # a suite with one failing test would never save).
    - if: inputs.cache == 'true' && inputs.backend == 'warpbuild' && inputs.lookup != 'true' && inputs.target == 'true'
      id: restore
      uses: WarpBuilds/cache/restore@40f3443ae7b70e568d6e2070ea897f3df94d7553 # v1
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: deps-${{ inputs.profile }}${{ inputs.key && format('-{0}', inputs.key) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ hashFiles('**/Cargo.lock', '!.ci/**') }}
        restore-keys: |
          deps-${{ inputs.profile }}${{ inputs.key && format('-{0}', inputs.key) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-
    - if: inputs.lookup == 'true'
      id: lookup
      uses: WarpBuilds/cache/restore@40f3443ae7b70e568d6e2070ea897f3df94d7553 # v1
      with:
        # The same paths as the save: the cache's version is derived from them.
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ inputs.target == 'true' && 'target' || '' }}
        key: ${{ inputs.target == 'true' && 'deps' || 'cargo' }}-${{ inputs.profile }}${{ inputs.key && format('-{0}', inputs.key) || '' }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ hashFiles('**/Cargo.lock', '!.ci/**') }}
        lookup-only: true

    - if: inputs.tools != '' && inputs.lookup != 'true'
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: ${{ inputs.tools }}
