name: Tests

# The test pipeline, shared by PRs (ci.yaml) and main (post-merge.yaml) so both
# measure the same way: one instrumented build packed per database group, the
# suites and the coverage matrix. `pr` mode also checks new tests for
# duplicates (the summary reports it all); `baseline` mode refreshes main's
# numbers PRs compare against. The job ids are the same for both callers, so
# they share cache entries.
#
# Shared: another repo calls this at a vantage commit. `run` is its changes
# job's outputs (runner, env, groups...), and every job runs the shared
# scripts from a checkout of this workflow's commit (.ci/).
on:
  workflow_call:
    inputs:
      mode:
        description: "pr | baseline"
        type: string
        required: true
      run:
        description: The changes job's outputs (toJSON(needs.changes.outputs))
        type: string
        required: true
      base:
        description: The PR's base commit (pr mode)
        type: string
        default: ""
    secrets:
      CI_SSH_KEYS:
        description: Deploy keys for private git dependencies (newline-joined)
        required: false
      COVERAGE_EXCEPTIONS_KEY:
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # One instrumented build of every changed crate that has tests, packed into
  # one archive per database group (a filterset over the same build, so no
  # recompile), so each suite downloads only its own binaries.
  build:
    runs-on: ${{ fromJSON(fromJSON(inputs.run).build_runner) }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - uses: ./.ci/.github/actions/prepare
        with:
          run: ${{ inputs.run }}
          ssh-keys: ${{ secrets.CI_SSH_KEYS }}
          profile: instrumented
          tools: cargo-llvm-cov,cargo-nextest
      - name: nextest config
        run: |
          # The repo's own, when it tracks one; vantage's example otherwise. Either
          # needs a `ci` profile writing junit.xml.
          git ls-files --error-unmatch .config/nextest.toml > /dev/null 2>&1 \
            || { mkdir -p .config && cp .ci/.config/nextest.toml.example .config/nextest.toml; }
      - name: Build and pack an archive per group
        env:
          TESTED: ${{ fromJSON(inputs.run).tested }}
          GROUP_LIST: ${{ fromJSON(inputs.run).groups }}
        run: |
          mapfile -t pkgs < <(jq -r '.[] | "-p", .' <<<"$TESTED")
          # The first call compiles, the rest only pack: --timings goes on the first.
          # CI_TIME=1 (the repo's env) reports the build's peak memory.
          timings=--timings
          time=()
          [ "${CI_TIME:-}" = 1 ] && time=(/usr/bin/time -v)
          for group in $(jq -c '.[]' <<<"$GROUP_LIST"); do
            slot=$(jq -r .slot <<<"$group")
            filter=$(jq -r '.crates | map("package(" + . + ")") | join(" or ")' <<<"$group")
            # --no-clean: llvm-cov otherwise wipes the workspace crates before
            # every call, rebuilding them once per group.
            "${time[@]}" cargo llvm-cov nextest-archive --no-clean $timings --all-features "${pkgs[@]}" -E "$filter" \
              --zstd-level 9 --archive-file "ci-$slot.tar.zst"
            timings=
            time=()
          done
          ls -la ci-*.tar.zst
      # Cargo's per-crate compile timeline: which crates hold up the build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings
          path: target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 7
      # upload-artifact can't loop: one step per slot (ci-changes allows six groups).
      - if: hashFiles('ci-1.tar.zst') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ci-tests-1, path: ci-1.tar.zst, retention-days: 1, compression-level: 0 }
      - if: hashFiles('ci-2.tar.zst') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ci-tests-2, path: ci-2.tar.zst, retention-days: 1, compression-level: 0 }
      - if: hashFiles('ci-3.tar.zst') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ci-tests-3, path: ci-3.tar.zst, retention-days: 1, compression-level: 0 }
      - if: hashFiles('ci-4.tar.zst') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ci-tests-4, path: ci-4.tar.zst, retention-days: 1, compression-level: 0 }
      - if: hashFiles('ci-5.tar.zst') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ci-tests-5, path: ci-5.tar.zst, retention-days: 1, compression-level: 0 }
      - if: hashFiles('ci-6.tar.zst') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ci-tests-6, path: ci-6.tar.zst, retention-days: 1, compression-level: 0 }

  # The coverage matrix's per-test runner: its own workspace and cache, built
  # alongside the archive instead of after it.
  matrix-rs:
    runs-on: ${{ fromJSON(fromJSON(inputs.run).runner) }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - uses: ./.ci/.github/actions/setup-rust
        with:
          key: matrix-rs
          workspaces: .ci/coverage/matrix-rs -> ../../../target/matrix-rs
          backend: ${{ fromJSON(fromJSON(inputs.run).cache) }}
      - run: cargo build --release --locked --manifest-path .ci/coverage/matrix-rs/Cargo.toml --target-dir target/matrix-rs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: matrix-rs, path: target/matrix-rs/release/matrix-rs, retention-days: 1 }

  # Each group starts only its databases, runs its crates' tests from its
  # archive, writes its coverage, measures its crates with the matrix, and
  # (pr mode) checks the PR's new tests for duplicates.
  suite:
    needs: [build, matrix-rs]
    name: suite (${{ matrix.group.name }})
    runs-on: ${{ fromJSON(fromJSON(inputs.run).runner) }}
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(fromJSON(inputs.run).groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      # Deploy keys and the hook too: some tests run cargo or shell out to tools.
      - uses: ./.ci/.github/actions/prepare
        with:
          run: ${{ inputs.run }}
          ssh-keys: ${{ secrets.CI_SSH_KEYS }}
          profile: instrumented
          tools: cargo-llvm-cov,cargo-nextest
          cache: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-tests-${{ matrix.group.slot }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: matrix-rs
      - if: toJSON(matrix.group.services) != '[]'
        uses: ./.ci/.github/actions/start-services
        with:
          services: ${{ toJSON(matrix.group.services) }}
      - name: Tests
        env:
          ARCHIVE: ci-${{ matrix.group.slot }}.tar.zst
          # The ci profile also writes JUnit for the report.
          NEXTEST_PROFILE: ci
          # Tests the repo runs elsewhere (an archive can only leave out whole binaries).
          EXCLUDE: ${{ fromJSON(fromJSON(inputs.run).suite_exclude || '""') }}
        run: |
          git ls-files --error-unmatch .config/nextest.toml > /dev/null 2>&1 \
            || { mkdir -p .config && cp .ci/.config/nextest.toml.example .config/nextest.toml; }
          # A fresh runner has no target dir to extract into.
          mkdir -p target/llvm-cov-target
          filter=()
          [ -n "$EXCLUDE" ] && filter=(-E "not ($EXCLUDE)")
          cargo llvm-cov nextest --archive-file "$ARCHIVE" --no-report --no-fail-fast "${filter[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.group.name }}
          # An archive run keeps nextest's store in the workspace target dir.
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Coverage for this group
        if: always()
        env:
          ARCHIVE: ci-${{ matrix.group.slot }}.tar.zst
          NAME: ${{ matrix.group.name }}
        run: cargo llvm-cov report --nextest-archive-file "$ARCHIVE" --lcov --output-path "lcov-$NAME.info"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-${{ matrix.group.name }}
          path: lcov-${{ matrix.group.name }}.info
          if-no-files-found: ignore
          retention-days: 1
      # Every crate of the group: its duplicate counts go into the report. The
      # matrix runs the PR's test binaries, so it gets no secret.
      - name: Coverage matrix
        id: matrix
        env:
          ARCHIVE: ci-${{ matrix.group.slot }}.tar.zst
          CRATES: ${{ toJSON(matrix.group.crates) }}
          MATRIX_SKIP: ${{ fromJSON(fromJSON(inputs.run).suite_exclude || '""') }}
        run: |
          chmod +x matrix-rs
          mkdir -p stats
          status=0
          for name in $(jq -r '.[]' <<<"$CRATES"); do
            MATRIX_REPORTS=0 MATRIX_ARCHIVE=$ARCHIVE MATRIX_RS=$PWD/matrix-rs .ci/coverage/matrix.sh "$name" || { status=1; continue; }
            cp "coverage/report/$name/pairs.json" "stats/$name.pairs.json"
          done
          exit $status
      # Only crates whose tests/ gained lines can hold a new duplicate. Reads
      # the matrix reports only; the exceptions key never reaches PR code.
      - name: Duplicate tests
        if: always() && inputs.mode == 'pr' && steps.matrix.outcome != 'skipped'
        env:
          BASE: ${{ inputs.base }}
          CRATES: ${{ toJSON(matrix.group.crates) }}
          NEW_TESTS: ${{ fromJSON(inputs.run).new_tests }}
          COVERAGE_EXCEPTIONS_KEY: ${{ secrets.COVERAGE_EXCEPTIONS_KEY }}
          # Without the key (forks), only entries unchanged since this base count.
          EXCEPTIONS_BASE: ${{ inputs.base }}
        run: |
          status=0
          for row in $(jq -c --argjson in "$CRATES" '.[] | select(.name as $n | $in | index($n))' <<<"$NEW_TESTS"); do
            name=$(jq -r .name <<<"$row"); dir=$(jq -r .dir <<<"$row")
            [ -f "coverage/report/$name/regions.json" ] || { echo "::error::no matrix report for $name"; status=1; continue; }
            python3 -I .ci/coverage/new_tests.py clusters "$name" "$dir" "$BASE" || status=1
            [ -f "coverage/report/$name/findings.json" ] && cp "coverage/report/$name/findings.json" "stats/$name.findings.json"
          done
          exit $status
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-${{ matrix.group.name }}
          path: stats
          if-no-files-found: ignore
          retention-days: 1

  # baseline mode: main's per-crate numbers (coverage, tests, dupes, overlaps),
  # the previous baseline with this merge's crates replaced. On PRs, the
  # summary job reports instead.
  baseline:
    needs: suite
    if: always() && inputs.mode == 'baseline' && needs.suite.result != 'skipped'
    runs-on: ${{ fromJSON(fromJSON(inputs.run).small_runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the previous coverage-baseline artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - uses: ./.ci/.github/actions/ci-results
      - name: Baseline
        env:
          RUN: ${{ inputs.run }}
        run: |
          python3 -I .ci/coverage/ci-report.py --run "$RUN" --junit junit --lcov lcov.info --stats stats \
            --baseline baseline/coverage-baseline.json --update-baseline coverage-baseline.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-baseline
          path: coverage-baseline.json
          retention-days: 90
