name: Main Workspace (v0.3 Core)

on:
  push:
    branches: ["main", "v2"]
  pull_request:
    branches: ["main", "v2"]
    paths:
      - "vantage-expressions/**"
      - "vantage-sql/**"
      - "vantage-surrealdb/**"
      - "vantage-mongodb/**"
      - "vantage-dataset/**"
      - "vantage-table/**"
      - "vantage-core/**"
      - "vantage-action/**"
      - "vantage-api-adapters/**"
      - "vantage-api-client/**"
      - "vantage-api-pool/**"
      - "vantage-log-writer/**"
      - "vantage-vista/**"
      - "vantage-memory/**"
      - "vantage-csv/**"
      - "vantage-diorama/**"
      - "vantage-diorama-aggregate/**"
      - "vantage-types/**"
      - "vantage-rhai/**"
      - "surreal-client/**"
      - "vantage-inventory/**"
      - "bakery_model3/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/main.yaml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: "main-workspace-v03"
          cache-workspace-crates: true
          cache-all-crates: true

      - name: Check workspace structure
        run: |
          echo "=== Workspace members ==="
          cargo metadata --format-version 1 | jq -r '.workspace_members[]'
          echo ""

      - name: Build all crates
        run: cargo build --workspace

      - name: Run all tests
        run: cargo test --workspace --exclude surreal-client --exclude vantage-surrealdb --exclude vantage-sql --exclude bakery_model3 --exclude vantage-mongodb --features vantage-table/mocks,vantage-diorama/diagnostics,vantage-diorama/test-util

      - name: Run API client and pool tests with all features
        run: cargo test -p vantage-api-client -p vantage-api-pool --all-features

      # Its Vista tests, the contract test among them, sit behind the `vista`
      # feature, which no workspace member enables.
      - name: Run log-writer tests with all features
        run: cargo test -p vantage-log-writer --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --exclude surreal-client --exclude vantage-surrealdb --exclude vantage-sql --exclude bakery_model3 --exclude vantage-mongodb --features vantage-table/mocks --all-targets -- -D warnings

      # Every workspace step above builds diorama with `diagnostics` (the
      # aggregate and adapter crates enable it, and the test step names it), so
      # its default build, the surface most consumers get, is checked on its own.
      - name: Check diorama's default build
        run: |
          cargo check -p vantage-diorama --no-default-features --lib
          cargo clippy -p vantage-diorama --all-targets -- -D warnings

      - name: Run clippy on API client and pool with all features
        run: cargo clippy -p vantage-api-client -p vantage-api-pool --all-features --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --exclude surreal-client --exclude vantage-surrealdb --exclude vantage-sql --exclude bakery_model3 --exclude vantage-mongodb --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
