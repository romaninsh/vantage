name: MongoDB Tests

on:
  pull_request:
    branches: ["main", "v2"]
    paths:
      - "vantage-mongodb/**"
      - "vantage-vista/**"
      - ".github/workflows/mongodb.yaml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: "mongodb-workspace-v03"
          cache-workspace-crates: true
          cache-all-crates: true

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo-vantage -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo-vantage mongosh --quiet --eval "db.runCommand({ping:1})" > /dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo-vantage mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo-vantage mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && exit 0
            sleep 1
          done
          echo "Replica set did not become primary" >&2
          docker logs mongo-vantage
          exit 1

      - name: Seed database
        run: |
          docker exec -i mongo-vantage mongosh vantage < vantage-mongodb/scripts/db/v2.js

      - name: Build vantage-mongodb
        run: cargo build -p vantage-mongodb --all-features

      - name: Run tests
        run: cargo test -p vantage-mongodb --all-features
        env:
          MONGODB_URL: mongodb://localhost:27017/?directConnection=true

      - name: Cleanup
        if: always()
        run: |
          docker stop mongo-vantage || true
