name: vantage-sql

on:
  pull_request:
    branches: ["main", "v2"]
    paths:
      - "vantage-sql/**"
      - "vantage-expressions/**"
      - "vantage-table/**"
      - "vantage-types/**"
      - "vantage-core/**"
      - "vantage-vista/**"
      - "bakery_model3/**"
      - ".github/workflows/vantage-sql.yaml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `feature`/`test` pick the cargo feature and test binary; MariaDB runs
        # the MySQL driver's tests. `mysql_image` is set everywhere so the
        # service always has an image.
        include:
          - backend: sqlite
            feature: sqlite
            test: sqlite
            mysql_image: mysql:8
            mysql_health: mysqladmin ping -h 127.0.0.1
          - backend: postgres
            feature: postgres
            test: postgres
            mysql_image: mysql:8
            mysql_health: mysqladmin ping -h 127.0.0.1
          - backend: mysql
            feature: mysql
            test: mysql
            mysql_image: mysql:8
            mysql_health: mysqladmin ping -h 127.0.0.1
          - backend: mariadb
            feature: mysql
            test: mysql
            mysql_image: mariadb:11
            mysql_health: healthcheck.sh --connect --innodb_initialized

    name: ${{ matrix.backend }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: vantage
          POSTGRES_DB: vantage
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vantage -d vantage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: ${{ matrix.mysql_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: vantage
          MYSQL_PASSWORD: vantage
          MYSQL_DATABASE: vantage
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: vantage
          MARIADB_PASSWORD: vantage
          MARIADB_DATABASE: vantage
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.mysql_health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: "vantage-sql-${{ matrix.feature }}-v02"
          cache-workspace-crates: true
          cache-all-crates: true

      - name: Populate SQLite database
        if: matrix.backend == 'sqlite'
        run: bash vantage-sql/scripts/sqlite/ingress.sh

      - name: Populate PostgreSQL databases
        if: matrix.backend == 'postgres'
        run: |
          cd vantage-sql/scripts/postgres
          # Load into shared vantage db (existing tests)
          for f in db/v[0-3]*.sql; do
            echo "Loading $f into vantage..."
            PGPASSWORD=vantage psql -h localhost -p 5433 -U vantage -d vantage -f "$f"
          done
          # Create per-file databases (new pattern)
          for f in db/v*.sql; do
            db_name="vantage_$(basename "$f" .sql)"
            echo "Creating $db_name and loading $(basename "$f")..."
            PGPASSWORD=vantage psql -h localhost -p 5433 -U vantage -d postgres \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$db_name' AND pid <> pg_backend_pid();" \
              -c "DROP DATABASE IF EXISTS \"$db_name\";" \
              -c "CREATE DATABASE \"$db_name\" OWNER vantage;"
            PGPASSWORD=vantage psql -h localhost -p 5433 -U vantage -d "$db_name" -f "$f"
          done

      - name: Populate MySQL databases
        if: matrix.feature == 'mysql'
        run: |
          cd vantage-sql/scripts/mysql
          # Load into shared vantage db (existing tests)
          for f in db/v[0-3]*.sql; do
            echo "Loading $f into vantage..."
            mysql -h 127.0.0.1 -uvantage -pvantage vantage < "$f"
          done
          # Create per-file databases (new pattern)
          for f in db/v*.sql; do
            db_name="vantage_$(basename "$f" .sql)"
            echo "Creating $db_name and loading $(basename "$f")..."
            mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS \`$db_name\`; CREATE DATABASE \`$db_name\`; GRANT ALL PRIVILEGES ON \`$db_name\`.* TO 'vantage'@'%';"
            mysql -h 127.0.0.1 -uvantage -pvantage "$db_name" < "$f"
          done

      - name: Build
        run: cargo build -p vantage-sql --features "${{ matrix.feature }},vista,rhai"

      - name: Test
        run: cargo test -p vantage-sql --features "${{ matrix.feature }},vista,rhai" --test ${{ matrix.test }}

      - name: Clippy
        run: cargo clippy -p vantage-sql --features "${{ matrix.feature }},vista,rhai" --all-targets -- -D warnings

      - name: Clippy without rhai
        run: cargo clippy -p vantage-sql --features "${{ matrix.feature }},vista" --all-targets -- -D warnings

      - name: Test vista modify without rhai
        if: matrix.feature == 'mysql'
        run: cargo test -p vantage-sql --features "mysql,vista" --test mysql vista_yaml_modify_without_rhai

      - name: Build bakery_model3
        if: matrix.feature != 'mysql'
        run: cargo build -p bakery_model3

      - name: bakery_model3 smoke test
        if: matrix.backend == 'sqlite' || matrix.backend == 'postgres'
        run: |
          cargo run -p bakery_model3 --example cli-vista -- ${{ matrix.backend }} bakeries
          cargo run -p bakery_model3 --example cli-vista -- ${{ matrix.backend }} products
          cargo run -p bakery_model3 --example cli-vista -- ${{ matrix.backend }} clients
          cargo run -p bakery_model3 --example cli-vista -- ${{ matrix.backend }} client id=marty :bakery
          cargo run -p bakery_model3 --example cli-vista -- ${{ matrix.backend }} bakery :clients[0] :orders
          cargo run -p bakery_model3 --example cli-vista -- ${{ matrix.backend }} 'bakery[0]' :products

      - name: bakery_model3 CSV smoke test
        if: matrix.backend == 'sqlite'
        run: |
          cargo run -p bakery_model3 --example cli-vista -- csv bakeries
          cargo run -p bakery_model3 --example cli-vista -- csv products
          cargo run -p bakery_model3 --example cli-vista -- csv clients
