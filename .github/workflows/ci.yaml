name: CI

# One pipeline for every PR. `changes` maps the diff to crates; everything
# after it tests only those (the ALL_TESTS label: everything). The tests
# themselves are tests.yaml, which post-merge runs too. A change to CI's own
# files runs ci-self instead of every crate. `summary` is the one check to
# require: it posts the PR's summary comment and fails if any job failed.
#
# Labels are read live, not from the event: adding ALL_TESTS re-runs the
# latest run (ci-label.yaml) instead of starting a second one, so no other
# label can post a `summary` over the real one.
on:
  pull_request:
    branches: ["main", "v2"]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # changes, tests, audit and summary are the shared pipeline other repos call
  # too (at a vantage commit); vantage calls them at its own.
  changes:
    uses: ./.github/workflows/changes.yaml
    permissions:
      contents: read
      pull-requests: read # labels, read live
    secrets:
      COVERAGE_EXCEPTIONS_KEY: ${{ secrets.COVERAGE_EXCEPTIONS_KEY }}

  lint:
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Format
        run: cargo fmt --all -- --check
      # The whole workspace in check mode: a changed API breaking a dependent
      # shows here even though the dependent's tests don't run.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Docs
        env:
          LIBS: ${{ needs.changes.outputs.libs }}
          RUSTDOCFLAGS: -D warnings
        run: |
          [ "$LIBS" = "[]" ] && exit 0
          mapfile -t pkgs < <(jq -r '.[] | "-p", .' <<<"$LIBS")
          cargo doc --no-deps --all-features --document-private-items "${pkgs[@]}"
      - name: No dependency on a layer above vantage
        if: needs.changes.outputs.manifests == 'true'
        run: script/check-repo-layers

  public-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # api/snapshot.sh pins both versions; read them rather than repeat them.
      - name: Read pinned versions
        id: pins
        run: |
          echo "nightly=$(sed -n 's/^NIGHTLY="\(.*\)"$/\1/p' api/snapshot.sh)" >> "$GITHUB_OUTPUT"
          echo "tool=$(sed -n 's/^PUBLIC_API_VERSION="\(.*\)"$/\1/p' api/snapshot.sh)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          profile: nightly
          toolchain: ${{ steps.pins.outputs.nightly }}
          key: public-api-${{ steps.pins.outputs.tool }}
          tools: cargo-binstall
      # A prebuilt binary when there is one; binstall compiles it otherwise.
      - name: Install cargo-public-api
        env:
          TOOL_VERSION: ${{ steps.pins.outputs.tool }}
        run: cargo binstall --no-confirm --locked "cargo-public-api@$TOOL_VERSION"
      - name: Regenerate snapshots
        run: api/snapshot.sh
      - name: Compare with committed snapshots
        run: |
          git add --intent-to-add api/
          if ! git diff --exit-code -- api/; then
            echo "::error::Public API differs from api/*.txt. Run 'mise run api-snapshot' and commit the result."
            exit 1
          fi
      - name: Check API rules
        run: bash api/rules.sh

  # Build, suites and coverage matrix: the same jobs main runs for its
  # baseline, so the summary compares like with like.
  tests:
    needs: changes
    if: needs.changes.outputs.groups != '[]'
    uses: ./.github/workflows/tests.yaml
    permissions:
      contents: read
      actions: read
    with:
      mode: pr
      run: ${{ toJSON(needs.changes.outputs) }}
      base: ${{ github.event.pull_request.base.sha }}
    secrets:
      COVERAGE_EXCEPTIONS_KEY: ${{ secrets.COVERAGE_EXCEPTIONS_KEY }}

  # CI's own files changed: lint the workflows and check that ci-changes still
  # selects sensibly on known merges, instead of running every crate's tests.
  ci-self:
    needs: changes
    if: needs.changes.outputs.ci_self == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # install-action doesn't carry actionlint (it falls back to crates.io,
      # where there's no such crate): the release binary, pinned.
      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          # shellcheck's info notes (publish-on-merge's unquoted words) don't fail it.
          SHELLCHECK_OPTS: --severity=warning
        run: |
          gh release download v1.7.12 -R rhysd/actionlint -p 'actionlint_1.7.12_linux_amd64.tar.gz' -O - \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      # Known merges and what they must select: a crate-only change selects
      # just its crates, a lockfile bump of members stays narrow.
      - name: ci-changes on known merges
        run: |
          check() {
            got=$(script/ci-changes --base "$1^1" --head "$1" | sed -n 's/^crates=//p')
            [ "$got" = "$2" ] || { echo "::error::ci-changes on $1 selected $got, expected $2"; exit 1; }
          }
          check ca159cb4 '["vantage-diorama","vantage-table","vantage-vista"]'
          check ea5cfe11 '["surreal-client"]'
          check 4ac8b5b9 '["vantage-api-adapters","vantage-diorama","vantage-docs","vantage-memory"]'
      - name: Python scripts compile
        run: python3 -m py_compile script/ci-changes coverage/*.py coverage/matrix-rs/skills/matrix-based-test-cleanup/*.py

  # Doctests and diorama's cucumber `bdd` can't run from a nextest archive.
  doctests:
    needs: changes
    if: needs.changes.outputs.libs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Doctests
        env:
          LIBS: ${{ needs.changes.outputs.libs }}
        run: |
          mapfile -t pkgs < <(jq -r '.[] | "-p", .' <<<"$LIBS")
          cargo test --doc --all-features "${pkgs[@]}"
      - name: diorama bdd
        if: contains(fromJSON(needs.changes.outputs.crates), 'vantage-diorama')
        run: cargo test -p vantage-diorama --all-features --test bdd

  excluded:
    needs: changes
    if: needs.changes.outputs.excluded != '[]'
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.excluded) }}
    uses: ./.github/workflows/suite-excluded.yaml
    permissions:
      contents: read
    with:
      dir: ${{ matrix.crate.dir }}
      workdir: ${{ matrix.crate.workdir }}
      kind: ${{ matrix.crate.kind }}
    secrets: inherit

  # ALL_TESTS only: MariaDB under the MySQL driver, and the bakery CLI smokes.
  gated:
    needs: changes
    if: needs.changes.outputs.gated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/start-services
        with:
          services: '["mysql","postgres","sqlite","surreal"]'
          mysql-image: mariadb:11
      - name: MariaDB
        run: cargo test -p vantage-sql --all-features --test mysql
      - name: bakery_model3 smokes
        run: |
          cargo run -p bakery_model3 --example 0-intro
          for db in sqlite postgres; do
            cargo run -p bakery_model3 --example cli-vista -- $db bakeries
            cargo run -p bakery_model3 --example cli-vista -- $db products
            cargo run -p bakery_model3 --example cli-vista -- $db clients
            cargo run -p bakery_model3 --example cli-vista -- $db client id=marty :bakery
            cargo run -p bakery_model3 --example cli-vista -- $db bakery :clients[0] :orders
            cargo run -p bakery_model3 --example cli-vista -- $db 'bakery[0]' :products
          done
          cargo run -p bakery_model3 --example cli-vista -- csv bakeries
          cargo run -p bakery_model3 --example cli-vista -- csv products
          cargo run -p bakery_model3 --example cli-vista -- csv clients

  # RustSec advisories in the workspace lockfile, when the PR touches a
  # manifest or the lockfile (nothing else can bring one in). Only advisories
  # its lockfile change brings in fail it; the rest are listed in the summary
  # for main to fix.
  audit:
    needs: changes
    # Changed crates get their advisories listed; a lockfile change can bring new ones.
    if: needs.changes.outputs.crates != '[]' || needs.changes.outputs.manifests == 'true'
    uses: ./.github/workflows/audit.yaml
    permissions:
      contents: read
    with:
      run: ${{ toJSON(needs.changes.outputs) }}
      base: ${{ github.event.pull_request.base.sha }}

  # The one check to require: posts the summary comment and fails if any job
  # failed or a version is owed.
  summary:
    needs: [changes, lint, public-api, tests, ci-self, doctests, excluded, gated, audit]
    if: always()
    uses: ./.github/workflows/summary.yaml
    permissions:
      contents: read
      actions: read # this run's artifacts and main's coverage-baseline
      pull-requests: write # the summary comment
    with:
      run: ${{ toJSON(needs.changes.outputs) }}
      jobs: ${{ toJSON(needs) }}
