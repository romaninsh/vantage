name: Repo layers

# vantage is the bottom layer: vantage <- vantage-lib <- vantage-server and
# vantage-ui. script/check-repo-layers fails if a crate here depends on one of
# theirs. Runs on every PR with no `paths:` filter, so a dependency added
# through any manifest is caught.

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: No dependency on a layer above vantage
        run: script/check-repo-layers
