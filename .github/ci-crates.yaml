# What script/ci-changes needs to know beyond `cargo metadata`.
#
# Other repos running the shared pipeline add their own keys; vantage keeps
# every default:
#   runner / build_runner / small_runner   runner labels (ubuntu-latest)
#   env: {VAR: value}                      extra env for every cargo job
#   dependents: true                       also test members depending on a changed one
#   cache: warpbuild                       WarpBuild's cache instead of rust-cache
#   warm: full-on-miss                     post-merge builds everything when main's cache key is new
#   internal_tests: allow                  PRs may add tests under src/ (vantage forbids them)
#   flags: {name: [crates]}                outputs flags.name: one of them is tested (gates own jobs)
#   archive_exclude: <nextest filter>      tests kept out of the archive (run them elsewhere)
#   skill_url: <url>                       the cleanup skill the summary links to
#   versioning: {mode: app, crate, changelog, heading, plist, skip_label}
#                                          one app version instead of per-crate versions
# A script at .github/ci-setup.sh runs in every shared cargo job (apt packages).

# Databases a crate's tests need. `sqlite` is a seeded file, not a container.
services:
  vantage-sql: [postgres, mysql, sqlite]
  vantage-surrealdb: [surreal]
  surreal-client: [surreal]
  bakery_model3: [surreal]
  vantage-mongodb: [mongo]

# A change to any of these means every crate changed: they change how every
# crate builds or tests.
global:
  - Cargo.toml
  - rust-toolchain*
  - .config/**

# The CI's own files. A change here runs the ci-self job (actionlint, and
# script/ci-changes replayed on past merges), not every crate's tests.
ci_self:
  - .github/**
  - script/ci-changes
  - script/ci-audit
  - script/check-repo-layers
  - coverage/**.py
  - coverage/**.sh
  - coverage/matrix-rs/**

# Crates whose types appear in the api/*.txt public-API snapshots.
api_inputs:
  - vantage-core
  - vantage-types
  - vantage-expressions
  - vantage-dataset
  - vantage-table
  - vantage-rhai
  - vantage-vista
  - vantage-diorama

# Tested but not reported for coverage: tutorials and demo models.
coverage_ignore:
  - learn-*
  - bakery_model4

# Changes here run the book job.
book:
  - docs4/**

# Crates outside the workspace (root Cargo.toml `exclude`), each with its own
# lockfile, run by suite-excluded.yaml when a file under the directory changes,
# and all of them under the ALL_TESTS label. `kind` picks the suite's extra
# steps; `workdir` is where Cargo.toml sits when it isn't the directory itself.
# Directories not listed have no CI suite.
excluded:
  vantage-aws: { kind: aws }
  vantage-kubernetes: { kind: kubernetes }
  vantage-cmd: {}
  vantage-spacetimedb: {}
  vantage-ui-adapters: { kind: ui }
  example_egui: { kind: ui-example }
  example_gpui: { kind: ui-example }
  example_slint: { kind: ui-example }
  example_tui: { kind: ui-example }
  example_cursive: { kind: ui-example }
  example_tauri: { kind: ui-example, workdir: example_tauri/src-tauri }
