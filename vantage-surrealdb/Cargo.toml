[package]
edition = "2024"
name = "vantage-surrealdb"
version = "2.1.1"
license = "MIT OR Apache-2.0"
authors = ["Romans Malinovskis <me@nearly.guru>"]
description = "Vantage extension for SurrealDB"
homepage = "https://romaninsh.github.io/vantage"
repository = "https://github.com/romaninsh/vantage"
autoexamples = false

[features]
default = ["decimal"]
decimal = ["surreal-client/decimal", "rust_decimal"]
vista = ["dep:vantage-vista"]
# `rhai` powers both the standalone query DSL and (with `vista`) scripted
# reference traversal, so it pulls in the vista layer and its conventional
# engine. Keeping them coupled means `register_rhai_extensions` always has the
# `vantage-vista` rhai vocabulary to layer onto.
rhai = ["dep:vantage-rhai", "vista", "vantage-vista/rhai"]

[dependencies]
async-trait = "0.1"
vantage-core = { version = "1.1.0", path = "../vantage-core" }
vantage-expressions = { version = "1.2.0", path = "../vantage-expressions", features = ["chrono"] }
vantage-table = { version = "3.0.0", path = "../vantage-table" }
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset" }
vantage-types = { version = "1.0.0", path = "../vantage-types", features = ["serde"] }
vantage-vista = { version = "2.1.0", path = "../vantage-vista", optional = true }
surreal-client = { version = "1.0.0", path = "../surreal-client" }

async-stream = "0.3"
ciborium = "0.2"
hex = "0.4"
indexmap = { version = "2.14.0", features = ["serde"] }
paste = "1.0"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
base64 = "0.22"
md5 = "0.8"
serde_path_to_error = "0.1"
rust_decimal = { version = "1.42", optional = true }
uuid = { version = "1.23", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
vantage-rhai = { version = "1.1.0", path = "../vantage-rhai", optional = true }

[dev-dependencies]
bakery_model3 = { path = "../bakery_model3" }
futures = "0.3"
vantage-dataset = { version = "1.1.2", path = "../vantage-dataset", features = ["contract"] }
serde_yaml_ng = "0.10"
tokio = { version = "1.52", features = ["full"] }
vantage-vista = { version = "2.1.0", path = "../vantage-vista", features = ["contract"] }
vantage-table = { version = "3.0.0", path = "../vantage-table", features = ["rhai"] }

[[example]]
name = "expr"
path = "examples/expr.rs"

# The name must be unique across the workspace: cargo writes every
# example to the same target/debug/examples directory, and two targets
# with one name overwrite each other.
[[example]]
name = "rhai_test_surreal"
path = "examples/rhai_test.rs"
required-features = ["rhai"]
