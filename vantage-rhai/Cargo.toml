[package]
name = "vantage-rhai"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "One Rhai host for every Vantage YAML script slot: slot types, limits, vocab/resolver traits, discovery, template scanner"
repository = "https://github.com/romaninsh/vantage"
readme = "README.md"

[lib]
doctest = false

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
# `internals` exposes rhai's AST (`Stmt`, `Expr`), which vantage-vista walks to
# refuse dropped handles; its shape may change in any rhai minor release, so the
# range is bounded. Raise the upper bound only after vantage-vista's discard
# tests (`rhai/eval/discard/tests.rs`) pass against the new release.
rhai = { version = ">=1.25, <1.27", default-features = false, features = ["std", "sync", "serde", "internals"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
schemars = { version = "0.8", optional = true }

[dev-dependencies]
# The quickstart example deserializes its slots from YAML, which is where a
# real consumer's slots come from.
serde_yaml_ng = "0.10"
